# config/node_maintenance.vars.conf
# ==============================================================================
# Settings for scripts/biome_node_maintenance.sh: OS updates (unattended-upgrades)
# and the rstudio-server restart they need, only in the night window and only
# when the node is free (ADR-0007). Site values go in
# config/site/node_maintenance.site.vars.conf (gitignored), read after this
# file. Every key can also be set in the environment.
# ==============================================================================

# Night window, local time, HHMM. The timer fires every 15 minutes from the
# hour of MAINT_WINDOW_START to MAINT_WINDOW_END; slots before
# MAINT_WINDOW_START only log. Same window as the R package sync
# (config/pkg_sync.vars.conf): the two jobs never run at the same time on a
# node (see MAINT_PKG_SYNC_LOCK), and no node waits for another.
MAINT_WINDOW_START="${MAINT_WINDOW_START:-0330}"
MAINT_WINDOW_END="${MAINT_WINDOW_END:-0500}"

# After this many nights in a row without a free slot, every deferred run logs
# a warning to the journal (priority warning, tag biome-node-maintenance) and
# the report status becomes "overdue": security updates are waiting.
MAINT_OVERDUE_NIGHTS="${MAINT_OVERDUE_NIGHTS:-3}"

# true = after the upgrade, restart rstudio-server when needrestart says it
# runs outdated libraries AND the node is still free. false = only report it.
MAINT_RESTART_RSTUDIO="${MAINT_RESTART_RSTUDIO:-true}"

# Lock file of scripts/biome_pkg_sync.sh (its LOCK_FILE default). While the
# sync holds it, this job defers to the next slot.
MAINT_PKG_SYNC_LOCK="${MAINT_PKG_SYNC_LOCK:-/run/lock/biome-pkg-sync.lock}"

# Local state and reports.
MAINT_STATE_DIR="${MAINT_STATE_DIR:-/var/lib/biome-node-maintenance}"

# ── Reboot on a free node and drain escalation (ADR-0009) ───────────────────
# Every default below keeps the ADR-0007 behaviour: no reboot, no email. The
# timer runs the script from the host checkout, so a git pull must never turn
# them on by itself: enable them per host in the site file.

# true = when a reboot is needed (needrestart kernel status 2 or 3, or
# /var/run/reboot-required) and the node is free, reboot it inside the window.
MAINT_REBOOT="${MAINT_REBOOT:-false}"

# Weekdays (date +%u: 1 = Monday ... 7 = Sunday) on which THIS node may
# reboot, space separated; empty = any night. Give every host a different day
# so two nodes are never down together, e.g. calc04 "1", calc03 "2".
MAINT_REBOOT_DAYS="${MAINT_REBOOT_DAYS:-}"

# Seconds between the last free-node check and the reboot. The node must be
# free at both checks; a login in between moves the reboot to the next slot.
MAINT_REBOOT_RECHECK_SECONDS="${MAINT_REBOOT_RECHECK_SECONDS:-60}"

# Escalation while the node stays busy (0 = off). Nothing is ever killed.
#   ADMIN: after this many nights in a row, one email per night to the admin
#          recipients with who keeps the node busy (user, process, age, CPU).
#   USERS: after this many nights with a reboot pending (needs MAINT_REBOOT=true),
#          one email per night to each blocking user: save, quit, use another node.
MAINT_NOTIFY_ADMIN_NIGHTS="${MAINT_NOTIFY_ADMIN_NIGHTS:-0}"
MAINT_NOTIFY_USERS_NIGHTS="${MAINT_NOTIFY_USERS_NIGHTS:-0}"

# Mail settings and helpers deployed by scripts/50_setup_nodes.sh for the R
# orphan notifier (same SMTP relay, admin recipients, user_email_map.txt).
MAINT_MAIL_CONF="${MAINT_MAIL_CONF:-/etc/biome-calc/conf/r_orphan_cleanup.conf}"
MAINT_MAIL_HELPERS="${MAINT_MAIL_HELPERS:-/etc/biome-calc/script/orphan_cleanup_helpers.sh}"

# After a reboot done by this script, biome-node-postboot.service checks the
# node for up to this many seconds: rstudio-server and sssd active, every NFS
# mount in /etc/fstab mounted, the expected kernel running.
MAINT_POSTBOOT_TIMEOUT="${MAINT_POSTBOOT_TIMEOUT:-300}"

# Optional: look up each blocking user's address in Active Directory (attribute
# `mail`) with the node's own keytab (kinit -k HOST$), before falling back to
# user_email_map.txt overrides and the MAIL_DOMAINS_USER pattern. Empty = off.
# Example: MAINT_AD_LDAP_URI="ldap://ad.example.org"
#          MAINT_AD_BASE_DN="dc=ad,dc=example,dc=org"
MAINT_AD_LDAP_URI="${MAINT_AD_LDAP_URI:-}"
MAINT_AD_BASE_DN="${MAINT_AD_BASE_DN:-}"
